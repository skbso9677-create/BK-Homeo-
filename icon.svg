<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Homeopathic Cross & Leaf Emblem -->
  <g filter="url(#shadow)">
    <!-- Medicine Dropper & Cross -->
    <circle cx="256" cy="230" r="130" fill="#ffffff" opacity="0.95"/>
    <!-- Medical Cross in Center -->
    <path d="M236 150 h40 v56 h56 v40 h-56 v56 h-40 v-56 h-56 v-40 h56 z" fill="#047857"/>
    <!-- Green Herbal Leaf -->
    <path d="M290 190 Q340 160 360 200 Q360 250 310 240 Q290 220 290 190 Z" fill="#10b981"/>
  </g>
  
  <!-- "BK HOMEO" Text -->
  <text x="256" y="415" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="4">
    BK HOMEO
  </text>
  <text x="256" y="450" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="20" fill="#a7f3d0" letter-spacing="2">
    SAHARANPUR
  </text>
</svg>
